<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B0F17" />
    <title>portfolio</title>
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('portfolio-color-mode');
          if (mode !== 'light' && mode !== 'dark') mode = 'dark';
          document.documentElement.dataset.theme = mode;
          document.documentElement.style.colorScheme = mode;
          if (mode === 'light') {
            document.documentElement.style.setProperty('--portfolio-bg', '#F7F4EF');
            document.documentElement.style.setProperty('--portfolio-surface', '#FFFFFF');
            document.documentElement.style.setProperty('--portfolio-surface-2', '#F0EBE3');
            document.documentElement.style.setProperty('--portfolio-fg', '#1A1714');
            document.documentElement.style.setProperty('--portfolio-muted', '#6B635A');
            document.documentElement.style.setProperty('--portfolio-line', 'rgba(26,23,20,0.10)');
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#F7F4EF');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
